      background: radial-gradient(ellipse at 18% 12%, rgba(30,83,91,.28), transparent 35%),

    .date-card { flex: 0 0 72px; width: 72px; scroll-snap-align: start; }
    .date-card.selected { border-color: rgba(224,188,119,.9); background: rgba(204,164,91,.2); color: #f6dc9f; }

    .faq-answer { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s ease; }
    .faq-item.open .faq-answer { grid-template-rows: 1fr; }
    .faq-answer > div { overflow: hidden; }
    .faq-icon { transition: transform .3s ease; }
    .faq-item.open .faq-icon { transform: rotate(45deg); }
    .lightbox, .map-modal { opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility .25s ease; }
    .lightbox.open, .map-modal.open { opacity: 1; visibility: visible; }
    .lightbox img { transform: scale(.88); transition: transform .45s cubic-bezier(.2,.8,.2,1.25); }
    .lightbox.open img { transform: scale(1); }
    .spin { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .mobile-nav { display: none; }
    .mobile-nav.open { display: block; }
    .sticky-booking { transform: translateY(110%); transition: transform .3s ease; }
    .sticky-booking.visible { transform: translateY(0); }
    .safe-bottom { padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }

    let currentLang = localStorage.getItem("solmare-language") || "ro";
    let checkinDate = null, checkoutDate = null;
    let selectedCheckinButton = null, selectedCheckoutButton = null;
    const bookingModal = document.getElementById("bookingModal");
    const statusBox = document.getElementById("bookingStatus");
    const checkButton = document.getElementById("checkAvailability");
    const sendButton = document.getElementById("sendRequest");
    const dateError = document.getElementById("dateError");
    const pricePerNight = 85;

    function t(key) { return translations[currentLang]?.[key] ?? translations.ro[key] ?? key; }

    function applyLanguage(lang) {
      if (!translations[lang]) return;
      currentLang = lang;
      localStorage.setItem("solmare-language", lang);
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
      document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
      document.querySelectorAll("[data-i18n-attr]").forEach(el => {
        const [attr, key] = el.dataset.i18nAttr.split(":");
        el.setAttribute(attr, t(key));
      });
      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.classList.toggle("text-amber-400", btn.dataset.lang === lang);
        btn.classList.toggle("text-white/50", btn.dataset.lang !== lang);
      });
      if (bookingModal.classList.contains("flex")) renderDateRails();
      updateEstimate();
      updateWeatherText();
    }

    document.querySelectorAll(".lang-btn").forEach(btn => btn.addEventListener("click", () => applyLanguage(btn.dataset.lang)));

    function openBooking() {
      document.getElementById("mobileNav").classList.remove("open");
      document.getElementById("menuToggle").setAttribute("aria-expanded", "false");
      bookingModal.classList.remove("hidden");
      bookingModal.classList.add("flex");
      document.body.style.overflow = "hidden";
      renderDateRails();
      statusBox.innerHTML = `<span>${t("baseEstimate")}</span>`;
    }
    function closeBooking() {
      bookingModal.classList.add("hidden");
      bookingModal.classList.remove("flex");
      document.body.style.overflow = "";
    }
    document.querySelectorAll(".open-booking").forEach(btn => btn.addEventListener("click", openBooking));
    document.getElementById("closeBooking").addEventListener("click", closeBooking);
    bookingModal.addEventListener("click", e => { if (e.target === bookingModal) closeBooking(); });

    document.getElementById("menuToggle").addEventListener("click", function() {
      const nav = document.getElementById("mobileNav");
      const open = nav.classList.toggle("open");
      this.setAttribute("aria-expanded", String(open));
    });
    document.querySelectorAll("#mobileNav a").forEach(link => link.addEventListener("click", () => {
      document.getElementById("mobileNav").classList.remove("open");
      document.getElementById("menuToggle").setAttribute("aria-expanded", "false");
    }));

    function dateISO(date) {
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
    }
    function formatDate(date) {
      if (!date) return "—";
      const locale = currentLang === "ro" ? "ro-RO" : currentLang === "ru" ? "ru-RU" : "en-GB";
      return new Intl.DateTimeFormat(locale, { day: "numeric", month: "short" }).format(date);
    }
    function nightCount() {
      if (!checkinDate || !checkoutDate || checkoutDate <= checkinDate) return 0;
      return Math.round((Date.UTC(checkoutDate.getFullYear(), checkoutDate.getMonth(), checkoutDate.getDate()) -
        Date.UTC(checkinDate.getFullYear(), checkinDate.getMonth(), checkinDate.getDate())) / 86400000);
    }
    function updateEstimate() {
      if (!statusBox) return;
      const nights = nightCount();
      if (!nights) {
        statusBox.innerHTML = `<span>${t("baseEstimate")}</span>`;
        return;
      }
      statusBox.innerHTML = `<span>${t("estimate").replace("{nights}", nights).replace("{total}", nights * pricePerNight)}</span>`;
    }
    function buildDateRail(container, type) {
      container.innerHTML = "";
      const base = new Date();
      base.setHours(0,0,0,0);
      for (let i = 0; i < 60; i++) {
        const day = new Date(base);
        day.setDate(base.getDate() + i);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "date-card snap-start rounded-2xl border border-white/10 bg-white/[.04] px-2 py-3 text-center transition hover:border-white/30";
        button.dataset.date = dateISO(day);
        const locale = currentLang === "ro" ? "ro-RO" : currentLang === "ru" ? "ru-RU" : "en-GB";
        button.innerHTML = `<span class="block text-[10px] uppercase tracking-wide text-white/45">${translations[currentLang].weekdays[day.getDay()]}</span><span class="mt-1 block text-lg font-semibold">${day.getDate()}</span><span class="block text-[10px] text-white/45">${new Intl.DateTimeFormat(locale,{month:"short"}).format(day)}</span>`;
        button.addEventListener("click", () => {
          const picked = new Date(`${button.dataset.date}T00:00:00`);
          if (type === "checkin") {
            checkinDate = picked;
            if (selectedCheckinButton) selectedCheckinButton.classList.remove("selected");
            selectedCheckinButton = button;
            button.classList.add("selected");
          } else {
            checkoutDate = picked;
            if (selectedCheckoutButton) selectedCheckoutButton.classList.remove("selected","invalid");
            selectedCheckoutButton = button;
            button.classList.add("selected");
          }
          updateDateSelection();
        });
        container.appendChild(button);
        if (type === "checkin" && checkinDate && button.dataset.date === dateISO(checkinDate)) {
          button.classList.add("selected");
          selectedCheckinButton = button;
        }
        if (type === "checkout" && checkoutDate && button.dataset.date === dateISO(checkoutDate)) {
          button.classList.add("selected");
          selectedCheckoutButton = button;
        }
      }
    }
    function renderDateRails() {
      buildDateRail(document.getElementById("checkinDates"), "checkin");
      buildDateRail(document.getElementById("checkoutDates"), "checkout");
      updateDateSelection();
    }
    function updateDateSelection() {
      document.getElementById("checkinValue").textContent = formatDate(checkinDate);
      document.getElementById("checkoutValue").textContent = formatDate(checkoutDate);
      const invalid = Boolean(checkinDate && checkoutDate && checkoutDate <= checkinDate);
      dateError.classList.toggle("hidden", !invalid);
      if (selectedCheckoutButton) selectedCheckoutButton.classList.toggle("invalid", invalid);
      checkButton.disabled = invalid;
      checkButton.classList.toggle("opacity-50", invalid);
      checkButton.classList.toggle("cursor-not-allowed", invalid);
      sendButton.classList.add("hidden");
      checkButton.classList.remove("hidden");
      updateEstimate();
    }

    checkButton.addEventListener("click", () => {
      if (!checkinDate || !checkoutDate || checkoutDate <= checkinDate) {
        dateError.textContent = !checkinDate || !checkoutDate ? t("selectDates") : t("dateError");
        dateError.classList.remove("hidden");
        return;
      }
      checkButton.disabled = true;
      checkButton.classList.add("hidden");
      statusBox.innerHTML = `<div class="flex items-center gap-3 text-white/80"><span class="spin inline-block h-5 w-5 rounded-full border-2 border-white/20 border-t-amber-200"></span><span>${t("checking")}</span></div>`;
      window.setTimeout(() => {
        const nights = nightCount();
        statusBox.innerHTML = `<div class="flex items-start gap-3 text-emerald-100"><span class="grid h-7 w-7 shrink-0 place-items-center rounded-full bg-emerald-400/15 text-emerald-300">✓</span><span>${t("estimate").replace("{nights}", nights).replace("{total}", nights * pricePerNight)}</span></div>`;
        sendButton.classList.remove("hidden");
        checkButton.disabled = false;
      }, 1500);
    });
    sendButton.addEventListener("click", () => {
      statusBox.innerHTML = `<div class="flex items-start gap-3 text-emerald-100"><span class="grid h-7 w-7 shrink-0 place-items-center rounded-full bg-emerald-400/15 text-emerald-300">✓</span><span>${t("sent")}</span></div>`;
      sendButton.classList.add("hidden");
      checkButton.classList.add("hidden");
    });

    document.querySelectorAll(".faq-question").forEach(button => button.addEventListener("click", () => {
      const item = button.closest(".faq-item");
      const open = item.classList.toggle("open");
      button.setAttribute("aria-expanded", String(open));
    }));

    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    document.querySelectorAll(".gallery-card").forEach(card => card.addEventListener("click", () => {
      const image = card.querySelector("img");
      lightboxImage.src = card.dataset.image;
      lightboxImage.alt = image.alt;
      lightbox.classList.add("open");
      document.body.style.overflow = "hidden";
    }));
    function closeLightbox() {
      lightbox.classList.remove("open");
      document.body.style.overflow = "";
    }
    document.getElementById("closeLightbox").addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", e => { if (e.target === lightbox) closeLightbox(); });

    const mapModal = document.getElementById("mapModal");
    document.getElementById("openMap").addEventListener("click", () => {
      mapModal.classList.add("open");
      document.body.style.overflow = "hidden";
    });
    function closeMap() {
      mapModal.classList.remove("open");
      document.body.style.overflow = "";
    }
    document.getElementById("closeMap").addEventListener("click", closeMap);
    mapModal.addEventListener("click", e => { if (e.target === mapModal) closeMap(); });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        closeBooking();
        closeLightbox();
        closeMap();
      }
    });

    const stickyBar = document.getElementById("stickyBooking");
    const heroObserver = new IntersectionObserver(entries => {
      stickyBar.classList.toggle("visible", !entries[0].isIntersecting);
    }, { threshold: .05 });
    heroObserver.observe(document.getElementById("hero"));

    const weatherIcons = {
      0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌦️",53:"🌦️",55:"🌧️",56:"🌧️",57:"🌧️",
      61:"🌧️",63:"🌧️",65:"🌧️",66:"🌧️",67:"🌧️",71:"🌨️",73:"🌨️",75:"❄️",77:"🌨️",
      80:"🌦️",81:"🌧️",82:"⛈️",85:"🌨️",86:"❄️",95:"⛈️",96:"⛈️",99:"⛈️"
    };
    let lastWeatherCode = 2;
    let isNight = false;
    function updateWeatherText() {
      const description = isNight
        ? (currentLang === "ru" ? "Ночь" : currentLang === "en" ? "Night" : "Noapte")
        : (translations[currentLang][`weather${lastWeatherCode}`] || t("weatherUnavailable"));
      document.getElementById("weatherDescription").textContent = description;
    }
    async function fetchWeather() {
      try {
        const response = await fetch("https://api.open-meteo.com/v1/forecast?latitude=42.2785&longitude=18.8415&current=temperature_2m,weather_code,is_day&timezone=Europe/Podgorica");
        if (!response.ok) throw new Error("Weather request failed");
        const current = (await response.json()).current;
        const temperature = Math.round(current.temperature_2m);
        document.querySelectorAll(".weather-temp").forEach(el => {
          el.textContent = `${temperature >= 0 ? "+" : ""}${temperature}°`;
        });
        lastWeatherCode = current.weather_code;
        isNight = current.is_day === 0;
        document.getElementById("weatherIcon").textContent = isNight ? "🌙" : (weatherIcons[lastWeatherCode] || "🌤️");
        updateWeatherText();
      } catch {
        document.getElementById("weatherDescription").textContent = t("weatherUnavailable");
      }
    }

    document.getElementById("year").textContent = new Date().getFullYear();
    applyLanguage(currentLang);
    statusBox.innerHTML = `<span>${t("baseEstimate")}</span>`;
    fetchWeather();
    window.setInterval(fetchWeather, 30 * 60 * 1000);
  </script>
</body>
</html>
